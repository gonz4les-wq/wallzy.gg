<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1226" />
    <meta name="description" content="Wallzy — a 9x9 turn-based wall-and-race strategy game vs a bot. Installable, offline-ready PWA." />
    <title>Wallzy.gg — Wall &amp; Race Strategy</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <h1 class="logo">Wallzy<span>.gg</span></h1>
        <button id="new-game" class="btn ghost">New Game</button>
      </header>

      <section class="scoreboard">
        <div class="player-card bot-card">
          <span class="role">Bot</span>
          <span class="time" id="bot-time">60.0</span>
          <span class="walls">Walls: <strong id="bot-walls">10</strong></span>
        </div>
        <div class="turn-pill" id="turn-indicator">Your turn</div>
        <div class="player-card human-card">
          <span class="role">You</span>
          <span class="time" id="human-time">60.0</span>
          <span class="walls">Walls: <strong id="human-walls">10</strong></span>
        </div>
      </section>

      <div class="board-wrap">
        <div id="board" class="board" aria-label="Game board"></div>
      </div>

      <section class="controls">
        <div class="control-group" role="group" aria-label="Action mode">
          <button id="mode-move" class="btn toggle active">Move</button>
          <button id="mode-wall" class="btn toggle">Place Wall</button>
        </div>
        <div class="control-group hidden" id="orient-group" role="group" aria-label="Wall orientation">
          <button id="orient-h" class="btn toggle active">Horizontal</button>
          <button id="orient-v" class="btn toggle">Vertical</button>
        </div>
      </section>

      <p class="hint">
        Reach the <strong>top row</strong> before the bot reaches the bottom.
        Tap a highlighted tile to move, or place walls to block the bot.
        Keys: arrows to move, <kbd>W</kbd> wall mode, <kbd>R</kbd> rotate.
      </p>
    </main>

    <div id="win-overlay" class="overlay hidden">
      <div class="modal">
        <h2 id="win-title">You Win!</h2>
        <p id="win-message"></p>
        <button id="win-restart" class="btn primary">Play Again</button>
      </div>
    </div>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
