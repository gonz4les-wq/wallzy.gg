<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="description" content="Daily — a clean, offline-ready todo list, day journal calendar, and shopping list. Installable PWA for iPhone." />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Daily" />

    <title>Daily — Todo · Calendar · Shopping</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <!-- ============ TODO ============ -->
    <section id="view-todo" class="view" aria-label="Todo list">
      <header class="view-head">
        <h1>To-Do</h1>
        <p id="todo-summary" class="subtle"></p>
      </header>
      <div class="add-row">
        <input id="todo-input" class="text-input" type="text" inputmode="text"
               placeholder="Add a task…" autocomplete="off" enterkeyhint="done" maxlength="200" />
        <button id="todo-add" class="add-btn" aria-label="Add task">+</button>
      </div>
      <ul id="todo-list" class="list"></ul>
      <p id="todo-empty" class="empty hidden">Nothing here yet. Add your first task above. 🌱</p>
    </section>

    <!-- ============ CALENDAR ============ -->
    <section id="view-calendar" class="view hidden" aria-label="Calendar journal">
      <header class="view-head">
        <h1>Calendar</h1>
        <p class="subtle">Write a note on any day. Look back anytime.</p>
      </header>

      <div class="cal-nav">
        <button id="cal-prev" class="nav-btn" aria-label="Previous month">‹</button>
        <div id="cal-title" class="cal-title">Month</div>
        <button id="cal-next" class="nav-btn" aria-label="Next month">›</button>
      </div>
      <div class="cal-weekdays" aria-hidden="true">
        <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
      </div>
      <div id="cal-grid" class="cal-grid"></div>
      <button id="cal-today" class="ghost-btn">Jump to today</button>
    </section>

    <!-- ============ SHOPPING ============ -->
    <section id="view-shopping" class="view hidden" aria-label="Shopping list">
      <header class="view-head">
        <h1>Shopping</h1>
        <p id="shop-summary" class="subtle"></p>
      </header>

      <div class="profile-bar">
        <div id="profile-chips" class="profile-chips"></div>
        <button id="profile-add" class="chip-add" aria-label="New list">+ List</button>
      </div>

      <div class="add-row">
        <input id="shop-input" class="text-input" type="text"
               placeholder="Add an item…" autocomplete="off" enterkeyhint="done" maxlength="200" />
        <button id="shop-add" class="add-btn" aria-label="Add item">+</button>
      </div>
      <ul id="shop-list" class="list"></ul>
      <p id="shop-empty" class="empty hidden">This list is empty. Add something to buy. 🛒</p>
    </section>

    <!-- ============ TAB BAR ============ -->
    <nav class="tabbar" role="tablist" aria-label="Main navigation">
      <button class="tab" data-tab="todo" role="tab" aria-selected="true">
        <span class="tab-ico" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11" stroke-linecap="round"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span class="tab-lbl">To-Do</span>
      </button>
      <button class="tab" data-tab="calendar" role="tab" aria-selected="false">
        <span class="tab-ico" aria-hidden="true">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4" stroke-linecap="round"/></svg>
        </span>
        <span class="tab-lbl">Calendar</span>
      </button>
      <button class="tab" data-tab="shopping" role="tab" aria-selected="false">
        <span class="tab-ico" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M5 7h15l-1.5 9a2 2 0 0 1-2 1.7H8.5a2 2 0 0 1-2-1.7L5 7z" stroke-linejoin="round"/><path d="M8 7a4 4 0 0 1 8 0" stroke-linecap="round"/></svg>
        </span>
        <span class="tab-lbl">Shopping</span>
      </button>
    </nav>

    <!-- Day editor sheet (calendar) -->
    <div id="day-sheet" class="sheet hidden" role="dialog" aria-modal="true" aria-label="Day note">
      <div class="sheet-backdrop" data-close></div>
      <div class="sheet-card">
        <div class="sheet-head">
          <div>
            <div id="day-sheet-date" class="sheet-title">Day</div>
            <div id="day-sheet-sub" class="subtle"></div>
          </div>
          <button class="sheet-close" data-close aria-label="Close">✕</button>
        </div>
        <textarea id="day-note" class="day-note" placeholder="What do you want to remember about this day?"></textarea>
        <div class="sheet-actions">
          <span id="day-saved" class="saved-hint"></span>
          <button id="day-save" class="primary-btn">Save</button>
        </div>
      </div>
    </div>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
